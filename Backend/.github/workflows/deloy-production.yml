name: Deploy Graduate API on VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-graduate-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: tankien/api_graduate:v1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD,ENV_PRODUCTION
          script: |
            set -eu

            cd /home/production/graduate-api

            printf '%s' "$DOCKERHUB_PASSWORD" |
              docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            umask 077
            printf '%s\n' "$ENV_PRODUCTION" > .env

            docker compose config --quiet
            docker compose pull app

            docker compose up -d postgres

            attempt=0
            until docker compose exec -T postgres \
              pg_isready -U postgres -d graduate_project; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                echo "PostgreSQL chưa sẵn sàng"
                exit 1
              fi
              sleep 2
            done

            docker compose run --rm --no-deps app \
              npm run db:migrate

            docker compose up -d --no-deps --force-recreate app

            docker compose ps
            docker compose logs --tail 50 app
